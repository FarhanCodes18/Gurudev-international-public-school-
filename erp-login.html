<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Gurudev International ERP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/erp.css">
  <link rel="icon" type="image/png" href="assets/icons/gurudev_school-removebg-preview.png" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VT8PT9GZNW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-VT8PT9GZNW');
</script>
<link rel="stylesheet" href="css/responsive.css" />
<script class="disable-inspect">document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('keydown', e => { if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) e.preventDefault(); });</script>
<style>
  body {
    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  input, textarea, select {
    -webkit-user-select: auto !important;
    -ms-user-select: auto !important;
    user-select: auto !important;
  }
</style>
<script class="disable-copy-paste">
  document.addEventListener('contextmenu', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.ctrlKey && ['c', 'C', 'v', 'V', 'x', 'X', 'a', 'A', 'u', 'U', 's', 'S', 'p', 'P'].includes(e.key)) {
      e.preventDefault();
    }
  });
  document.addEventListener('copy', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
  document.addEventListener('cut', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
</script>
</head>

<body class="erp-auth-page">

  <div class="erp-auth-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <div class="erp-auth-card">
    <div class="erp-auth-header">
      <div class="erp-auth-logo"><img src="assets/icons/gurudev_school-removebg-preview.png" alt="Logo" class="erp-auth-logo-img" /></div>
      <h2>Welcome Back</h2>
      <p>Login to your Student Portal</p>
    </div>

    <div id="authAlert" class="erp-alert"></div>

    <form id="loginForm">
      
      <div style="display:flex; justify-content:center; gap: 24px; margin-bottom: 24px; font-weight:600; color:#0f172a;">
        <label style="cursor:pointer; display:flex; align-items:center; gap:6px;"><input type="radio" name="loginRole" value="student" checked onchange="toggleLoginType()"> <i class="fa-solid fa-user-graduate"></i> Student</label>
        <label style="cursor:pointer; display:flex; align-items:center; gap:6px;"><input type="radio" name="loginRole" value="teacher" onchange="toggleLoginType()"> <i class="fa-solid fa-chalkboard-user"></i> Teacher</label>
      </div>

      <div class="form-group" id="studentIdGroup">
        <label class="form-label" for="loginEmail">Mobile Number</label>
        <input type="tel" id="loginEmail" class="form-control" placeholder="Enter your 10-digit mobile number" required>
      </div>

      <div class="form-group" id="teacherClassGroup" style="display:none;">
        <label class="form-label" for="loginClass">Select Class</label>
        <select id="loginClass" class="form-control">
          <option value="6">Class 6</option>
          <option value="7">Class 7</option>
          <option value="8">Class 8</option>
          <option value="9">Class 9</option>
          <option value="10">Class 10</option>
          <option value="11">Class 11</option>
          <option value="12">Class 12</option>
        </select>
      </div>

      <script>
        window.toggleLoginType = function() {
          const role = document.querySelector('input[name="loginRole"]:checked').value;
          if(role === 'teacher') {
             document.getElementById('studentIdGroup').style.display = 'none';
             document.getElementById('loginEmail').required = false;
             document.getElementById('teacherClassGroup').style.display = 'block';
             document.querySelector('.erp-auth-header h2').textContent = "Faculty Login";
             document.querySelector('.erp-auth-header p').textContent = "Login to your Teacher Portal";
          } else {
             document.getElementById('studentIdGroup').style.display = 'block';
             document.getElementById('loginEmail').required = true;
             document.getElementById('teacherClassGroup').style.display = 'none';
             document.querySelector('.erp-auth-header h2').textContent = "Welcome Back";
             document.querySelector('.erp-auth-header p').textContent = "Login to your Student Portal";
          }
        }
      </script>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.9rem;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
          <input type="checkbox" id="rememberMe"> Remember Me
        </label>
        <a href="#" id="forgotPasswordLink" style="color: var(--primary); font-weight: 600;">Forgot Password?</a>
      </div>

      <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem;">
        Login
      </button>
    </form>
    
    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="erp-register.html" style="color: var(--primary); font-weight: 600;">Register Here</a>
    </div>
  </div>

  <script type="module" src="js/erp-auth.js?v=2"></script>
</body>
</html>
