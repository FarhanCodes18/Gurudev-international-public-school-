<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Gurudev International ERP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/erp.css">
</head>
<body class="erp-auth-page">

  <div class="erp-auth-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <div class="erp-auth-card">
    <div class="erp-auth-header">
      <div class="erp-auth-logo">GI</div>
      <h2>Welcome Back</h2>
      <p>Login to your Student Portal</p>
    </div>

    <div id="authAlert" class="erp-alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Mobile Number</label>
        <input type="tel" id="loginEmail" class="form-control" placeholder="Enter your 10-digit mobile number" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.9rem;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
          <input type="checkbox" id="rememberMe"> Remember Me
        </label>
        <a href="#" style="color: var(--primary); font-weight: 600;">Forgot Password?</a>
      </div>

      <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem;">
        Login
      </button>
    </form>
    
    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="erp-register.html" style="color: var(--primary); font-weight: 600;">Register Here</a>
    </div>
  </div>

  <script type="module" src="js/erp-auth.js"></script>
</body>
</html>
