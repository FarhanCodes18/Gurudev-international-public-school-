<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | GURUDEV SUPERPOWER PANEL</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e11d48;
      --primary-hover: #be123c;
      --bg-light: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: rgba(255, 255, 255, 0.9);
      --input-border: rgba(0, 0, 0, 0.06);
      --input-focus: rgba(225, 29, 72, 0.15);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-light);
      background-image: radial-gradient(circle at top right, rgba(225, 29, 72, 0.05), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.05), transparent 40%);
      min-height: 100vh;
      display: flex;
      color: var(--text-main);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 20px;
    }
    
    /* Animated Background Orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: float 12s infinite alternate ease-in-out;
    }
    .orb-1 {
      width: 450px; height: 450px;
      background: rgba(225, 29, 72, 0.12);
      top: -10%; left: -10%;
    }
    .orb-2 {
      width: 550px; height: 550px;
      background: rgba(59, 130, 246, 0.1);
      bottom: -20%; right: -10%;
      animation-delay: -6s;
    }
    
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 60px) scale(1.05); }
    }
    
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      margin: auto;
      z-index: 1;
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }
    
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 10px 20px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      position: relative;
    }
    
    /* Glossy reflection on card */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
      z-index: 2;
    }
    
    .login-header {
      padding: 45px 35px 20px;
      text-align: center;
    }
    
    .logo-container {
      width: 76px; height: 76px;
      margin: 0 auto 24px;
      background: #ffffff;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 28px rgba(225, 29, 72, 0.15);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .login-wrapper:hover .logo-container {
      transform: scale(1);
    }
    
    .logo-container img {
      width: 80%; height: 80%; object-fit: contain;
    }
    
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    
    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    
    .desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      font-weight: 400;
    }
    
    .login-body {
      padding: 20px 35px 45px;
    }
    
    .form-group {
      margin-bottom: 22px;
    }
    
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper i {
      position: absolute;
      left: 18px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }
    .input-wrapper i.right-icon {
      left: auto; right: 18px;
      cursor: pointer;
    }
    .input-wrapper i.right-icon:hover {
      color: var(--text-main);
    }
    
    .form-control {
      width: 100%;
      padding: 16px 16px 16px 50px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    
    .form-control::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--input-focus);
      background: #ffffff;
    }
    
    .form-control:focus + i, .form-control:focus ~ i:not(.right-icon) {
      color: var(--primary);
    }
    
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 28px;
      transition: color 0.3s ease;
    }
    
    .forgot-link:hover {
      color: var(--primary);
    }
    
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, #be123c 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 25px rgba(225, 29, 72, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .btn-submit::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: all 0.6s ease;
    }
    
    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(225, 29, 72, 0.4);
    }
    
    .btn-submit:hover::after {
      left: 150%;
    }
    
    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 5px 12px rgba(225, 29, 72, 0.3);
    }
    
    .btn-submit i.fa-spinner { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .login-footer {
      padding: 24px;
      text-align: center;
      border-top: 1px solid rgba(0,0,0,0.04);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(248, 250, 252, 0.5);
    }
    
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      color: #e11d48;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 22px;
      display: none;
      text-align: center;
      border: 1px solid rgba(239, 68, 68, 0.2);
      animation: shake 0.4s ease-in-out;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    
    .success-anim {
      animation: successScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes successScale {
      40% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0; }
    }
    
    @media (max-width: 480px) {
      .login-header {
        padding: 30px 20px 15px;
      }
      .logo-container {
        width: 60px; height: 60px;
        margin-bottom: 15px;
      }
      .title {
        font-size: 1.8rem;
      }
      .login-body {
        padding: 15px 20px 30px;
      }
      .form-control {
        padding: 14px 14px 14px 45px;
        font-size: 0.95rem;
      }
      .btn-submit {
        padding: 16px;
        font-size: 1.05rem;
      }
    }
  </style>
  <link rel="icon" type="image/png" href="assets/icons/gurudev_school-removebg-preview.png" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VT8PT9GZNW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VT8PT9GZNW');
  </script>
  <script class="disable-inspect">document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('keydown', e => { if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) e.preventDefault(); });</script>

<style>
  body {
    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  input, textarea, select {
    -webkit-user-select: auto !important;
    -ms-user-select: auto !important;
    user-select: auto !important;
  }
</style>
<script class="disable-copy-paste">
  document.addEventListener('contextmenu', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.ctrlKey && ['c', 'C', 'v', 'V', 'x', 'X', 'a', 'A', 'u', 'U', 's', 'S', 'p', 'P'].includes(e.key)) {
      e.preventDefault();
    }
  });
  document.addEventListener('copy', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
  document.addEventListener('cut', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
</script>
</head>

<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-container">
          <img src="assets/icons/gurudev_school-removebg-preview.png" alt="Logo" />
        </div>
        <div class="subtitle">Gurudev Admin</div>
        <h1 class="title">Superpower Panel</h1>
        <p class="desc">Authenticate to access the administrative dashboard and manage portal data.</p>
      </div>
      
      <div class="login-body">
        <form id="admin-login-form" autocomplete="off">
          <div class="error-msg" id="error-msg">Invalid credentials. Access denied.</div>
          
          <div class="form-group">
            <label class="form-label">USERNAME</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user-shield"></i>
              <input type="text" id="admin-user" class="form-control" placeholder="Enter admin ID" autocomplete="off" />
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">PASSWORD</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="admin-pass" class="form-control" placeholder="Enter security key" autocomplete="off" />
              <i class="fa-regular fa-eye right-icon" onclick="togglePassword()"></i>
            </div>
          </div>
          
          <a href="#" class="forgot-link">Recover Access?</a>
          
          <button type="submit" class="btn-submit" id="submit-btn">
            <span>Authorize Access</span>
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
          </button>
        </form>
      </div>
      
      <div class="login-footer">
        <i class="fa-solid fa-shield-halved" style="margin-right:5px;"></i> Restricted Area • Authorized Personnel Only
      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById('admin-pass');
      const icon = document.querySelector('.right-icon');
      if (pass.type === 'password') { 
        pass.type = 'text'; 
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else { 
        pass.type = 'password'; 
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('admin-user').value;
      const pass = document.getElementById('admin-pass').value;
      const btn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-msg');
      
      errorMsg.style.display = 'none';
      btn.innerHTML = '<i class="fa-solid fa-spinner"></i><span> Verifying...</span>';
      
      setTimeout(() => {
        if(user === 'gurudev@gmail.com' && pass === 'Gurudev@2008') {
          // Success
          btn.innerHTML = '<span>Access Granted </span><i class="fa-solid fa-check-circle"></i>';
          btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
          btn.style.boxShadow = '0 10px 20px rgba(16, 185, 129, 0.3)';
          
          setTimeout(() => {
            const wrapper = document.querySelector('.login-wrapper');
            wrapper.classList.add('success-anim');
            
            setTimeout(() => {
              sessionStorage.setItem('admin_session', 'active');
              window.location.href = 'gurudev-super.html';
            }, 600);
          }, 600);
        } else {
          // Error
          btn.innerHTML = '<span>Authorize Access</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
          errorMsg.style.display = 'block';
          
          // Trigger shake animation manually by re-adding element
          errorMsg.style.animation = 'none';
          errorMsg.offsetHeight; /* trigger reflow */
          errorMsg.style.animation = null; 
        }
      }, 1000);
    });
  </script>
</body>
</html>
