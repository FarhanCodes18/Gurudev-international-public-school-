<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/png" href="assets/icons/gurudev_school-removebg-preview.png" />
<title>Reset Transport Routes</title><script class="disable-inspect">document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('keydown', e => { if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) e.preventDefault(); });</script></head>
<body>
<h2>Deleting ALL transport routes... Please wait.</h2>
<div id="log"></div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyD778gbyVVrez8R__xnvVNRMAZjAqEhVgQ",
    authDomain: "gurudev-international.firebaseapp.com",
    projectId: "gurudev-international",
    storageBucket: "gurudev-international.firebasestorage.app",
    messagingSenderId: "683044437533",
    appId: "1:683044437533:web:d9aae17592bfa2701910f4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const logDiv = document.getElementById('log');

  function log(msg) {
    logDiv.innerHTML += '<p>' + msg + '</p>';
  }

  async function resetRoutes() {
    try {
      const snapshot = await getDocs(collection(db, 'transport_routes'));
      log('Found ' + snapshot.size + ' total routes in database.');

      if (snapshot.size === 0) {
        log('<strong style="color:green;">No routes to delete. Database is already empty!</strong>');
        return;
      }

      let deletedCount = 0;
      for (const d of snapshot.docs) {
        await deleteDoc(doc(db, 'transport_routes', d.id));
        log('Deleted route ID: ' + d.id);
        deletedCount++;
      }

      log('<strong style="color:green;">Success! All ' + deletedCount + ' routes have been completely removed.</strong>');
      log('<b>Aap ab apne Admin Panel me jaakar bilkul fresh aur naya Route add kar sakte hain!</b>');
    } catch(err) {
      log('<strong style="color:red;">Error: ' + err.message + '</strong>');
    }
  }

  resetRoutes();
</script>
</body>
</html>
