<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/png" href="assets/icons/gurudev_school-removebg-preview.png" />
<title>Cleanup Duplicates</title><script class="disable-inspect">document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('keydown', e => { if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) e.preventDefault(); });</script>
<style>
  body {
    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  input, textarea, select {
    -webkit-user-select: auto !important;
    -ms-user-select: auto !important;
    user-select: auto !important;
  }
</style>
<script class="disable-copy-paste">
  document.addEventListener('contextmenu', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.ctrlKey && ['c', 'C', 'v', 'V', 'x', 'X', 'a', 'A', 'u', 'U', 's', 'S', 'p', 'P'].includes(e.key)) {
      e.preventDefault();
    }
  });
  document.addEventListener('copy', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
  document.addEventListener('cut', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
</script>
</head>

<body>
<h2>Cleaning duplicate transport routes...</h2>
<div id="log"></div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyD778gbyVVrez8R__xnvVNRMAZjAqEhVgQ",
    authDomain: "gurudev-international.firebaseapp.com",
    projectId: "gurudev-international",
    storageBucket: "gurudev-international.firebasestorage.app",
    messagingSenderId: "683044437533",
    appId: "1:683044437533:web:d9aae17592bfa2701910f4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const logDiv = document.getElementById('log');

  function log(msg) {
    logDiv.innerHTML += '<p>' + msg + '</p>';
  }

  try {
    const snapshot = await getDocs(collection(db, 'transport_routes'));
    log('Total routes found: ' + snapshot.size);

    // Group by routeName to find duplicates
    const seen = {};
    const toDelete = [];

    snapshot.forEach(d => {
      const data = d.data();
      const key = data.routeName + '|' + data.busNumber + '|' + data.driverName;
      if (seen[key]) {
        toDelete.push(d.id);
      } else {
        seen[key] = d.id;
      }
    });

    log('Duplicates to remove: ' + toDelete.length);

    for (const id of toDelete) {
      await deleteDoc(doc(db, 'transport_routes', id));
      log('Deleted duplicate: ' + id);
    }

    log('<strong style="color:green;">Done! Duplicates removed. You can close this page now.</strong>');
  } catch(err) {
    log('<strong style="color:red;">Error: ' + err.message + '</strong>');
  }
</script>
</body>
</html>
